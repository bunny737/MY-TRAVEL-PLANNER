{# Mint header band used at the top of every inner page. `title` becomes the page's only <h1>. #}
<header class="band band-mint page-hero">
  <div class="container page-hero-inner">
    {% if eyebrow %}<span class="eyebrow">{{ eyebrow }}</span>{% endif %}
    <h1>{{ title }}</h1>
    {% if lead %}<p class="lead">{{ lead }}</p>{% endif %}
    {% if updated %}<p class="page-hero-meta">Last updated: {{ updated }}</p>{% endif %}
  </div>
</header>
